name: 'the rocket :rocket:'

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: ["opened", "synchronize"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Try to fail
      run: exit 1
